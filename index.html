<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="财富罗盘">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<title>财富罗盘</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111;--sub:#6b7280;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme=light]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f14;--card:#161b22;--tx:#f0f3f6;--sub:#8b949e;--bd:#2a313a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC",sans-serif;padding-bottom:calc(115px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px}
.c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}.s{color:var(--sub);font-size:12px}
.big{font-size:34px;font-weight:700}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.g b{display:block;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.row:last-child{border:0}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600}button.l{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x{width:auto;padding:2px 10px;background:none;color:var(--bad);border:0}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
nav a{flex:1;text-align:center;padding:9px 0 7px;color:var(--sub);font-size:13px;border-radius:22px;text-decoration:none;line-height:1.2}
nav a i{display:block;font-style:normal;font-size:26px;margin-bottom:2px}
nav a.on{color:#fff;background:var(--ac);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.hit{background:rgba(37,99,235,.1);border-radius:8px;padding:8px;margin:4px 0}
.q{text-align:center;font-size:14px;font-weight:600;letter-spacing:1px;padding:12px 8px 14px;color:var(--sub)}.q:before,.q:after{content:'—';margin:0 8px;opacity:.5}
.f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;align-items:center;margin:4px 0}.f3 input{padding:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
details.c summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.c summary::-webkit-details-marker{display:none}
details.c summary::after{content:'＋';color:var(--sub);font-size:18px;font-weight:400}
details.c[open]>summary::after{content:'－'}
details.c .inner{margin-top:10px}
.fold{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:#111;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:82vw;text-align:center}
#toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const K='localgoal.v1',TABS=[['📊','总览'],['🧾','账目'],['💰','收支'],['🎯','规划']];
const AC=['现金存款','理财基金','股票','自住房','投资房产','车辆','公积金/养老','其他'],DC=['房贷','车贷','信用卡','借款','其他'];
const INV=['现金存款','理财基金','股票','投资房产'];
// 全国家庭"净资产(含自住房)"分布锚点：[万元, 低于该值的家庭占比%]。
// 600万/1000万/1亿 来自胡润财富报告(2025.1.1: 506万户/200.5万户/12.6万户，按约5亿户折算)；10万/50万/100万/300万档为估算(2026.10按用户整理的区间取值)，可自行修改。
const A=[[0,5],[10,20],[38.8,50],[50,58],[100,79],[300,93.5]];
const HH=50000;// 全国家庭户数(万户)
const TIERS=[10,50,100,300,600,1000];
let S=load(),tab=0;
function def(){return{items:[],snaps:[],goal:{target:1000,save:2},basis:'net',flow:[]}}
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(K)))}catch(e){return def()}}
function curM(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')}
function normSnaps(a){const m={};a.slice().sort((x,y)=>x.d<y.d?-1:1).forEach(x=>m[x.d.slice(0,7)]=x.nw);return Object.keys(m).sort().map(d=>({d,nw:m[d]}))}
function autoSnap(){S.snaps=normSnaps(S.snaps);if(!S.items.length)return;const d=curM();
 S.snaps=S.snaps.filter(x=>x.d!=d);S.snaps.push({d,nw:calc().net})}
function save(){autoSnap();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const toast=t=>{const e=document.getElementById('toast');if(!e)return alert(t);e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const w=v=>Math.abs(v)>=10000?(v/10000).toFixed(2)+'亿':v.toFixed(2).replace(/\.?0+$/,'')+'万';
function calc(){let a=0,d=0,iv=0;S.items.forEach(i=>{if(i.t=='a'){a+=i.v;if(INV.includes(i.c))iv+=i.v}else d+=i.v});return{a,d,net:a-d,iv,rate:a?d/a*100:0}}
function pct(v){if(v<0)return 2;if(v>=A[A.length-1][0])return A[A.length-1][1];
 for(let i=1;i<A.length;i++)if(v<=A[i][0]){const[x0,y0]=A[i-1],[x1,y1]=A[i];
  const t=x0>0?Math.log(v/x0)/Math.log(x1/x0):(v-x0)/(x1-x0);return y0+(y1-y0)*t}}
function hh(p){const n=HH*(1-p/100);return n>=10000?(n/10000).toFixed(2)+'亿户':Math.round(n)+'万户'}
function months(start,target,sv,r){let v=start,m=0;if(v>=target)return 0;if(sv<=0&&r<=0)return null;
 while(v<target&&m<1200){v=v*(1+r/1200)+sv;m++}return m<1200?m:null}
const yrs=m=>m==null?'超过100年':m==0?'已达成':(m/12).toFixed(1)+' 年';
function basisVal(c){return S.basis=='net'?c.net:S.basis=='gross'?c.a:c.iv}
function view(){const c=calc();const el=document.getElementById('app');
 document.getElementById('nav').innerHTML=TABS.map((t,i)=>`<a href="#" data-i="${i}" class="${i==tab?'on':''}"><i>${t[0]}</i>${t[1]}</a>`).join('');
 el.innerHTML='<div class="q">财富是一个人综合能力的最佳体现</div>'+remind()+[vHome,vItems,vFlow,vPlan][tab](c);
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.p));}
document.getElementById('nav').onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();tab=+a.dataset.i;view();scrollTo(0,0)}};
function spark(){const s=S.snaps.slice(-24);if(s.length<2)return'<div class="s">至少记录两个月后显示趋势</div>';
 const v=s.map(x=>x.nw),mn=Math.min(...v),mx=Math.max(...v),R=mx-mn||1;
 const pts=v.map((y,i)=>`${i/(v.length-1)*300},${50-(y-mn)/R*44}`).join(' ');
 return`<svg viewBox="0 0 300 56" width="100%" height="70"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5"/></svg><div class="s">${s[0].d}：${w(s[0].nw)} → ${s[s.length-1].d}：${w(s[s.length-1].nw)}</div>`}
function vHome(c){const p=pct(c.net);
 return`<div class="c"><div class="s">净资产</div><div class="big ${c.net<0?'neg':''}">${w(c.net)}</div>
 <div class="s">${c.net<0?'净资产为负，位于全国多数家庭之后':c.net>=300?'已超过300万档（估算范围上限），更高位置暂无数据':'约超过全国 '+p.toFixed(0)+'% 的家庭（综合推算，非官方）'}</div></div>
 <div class="c g"><div><span class="s">总资产</span><b>${w(c.a)}</b></div><div><span class="s">总负债</span><b>${w(c.d)}</b></div><div><span class="s">负债率</span><b>${c.rate.toFixed(1)}%</b></div></div>
 <div class="c"><h2>资产构成</h2>${pie(catSum())}<div class="s" style="margin-top:6px">负债 ${w(c.d)}，单列不入饼图</div></div>
 ${splitCard()}
 <div class="c"><h2>净资产趋势（按月，取月末）</h2>${spark()}${snapList()}</div>
 ${benchFold(c)}
 <div class="c"><h2>备份（数据只存在本机）</h2><div class="s">iOS 长期不用可能清理数据，请定期导出并粘贴保存到备忘录。</div>
 <div class="s" style="margin-top:6px">备份文本可直接粘贴到备忘录保存。建议每月备份一次，换手机或清理数据前先备份。</div>
 <textarea id="bk" rows="3" placeholder="点「复制备份文本」生成；导入时把备忘录里的文本粘贴到这里"></textarea>
 <div class="f2" style="margin-top:8px"><button class="l" data-a="exp">复制备份文本</button><button class="l" data-a="imp">从文本导入</button></div></div>`}
function vItems(){const sec=(t,n,cats)=>{const L=S.items.map((x,i)=>[x,i]).filter(([x])=>x.t==t);
 return`<div class="c"><h2>${n}</h2>${L.map(([x,i])=>`<div class="row"><div>${esc(x.n)}<div class="s">${x.c}</div></div><div>${w(x.v)}<button class="x" data-a="del" data-p="${i}">删</button></div></div>`).join('')||'<div class="s">暂无</div>'}
 <div class="f" style="margin-top:10px"><div class="f2"><select id="c${t}">${cats.map(x=>`<option>${x}</option>`).join('')}</select><input id="n${t}" placeholder="名称"></div>
 <div class="f2"><input id="v${t}" type="number" inputmode="decimal" step="0.01" placeholder="金额（万元）"><button data-a="add" data-p="${t}">添加</button></div></div></div>`};
 return sec('a','资产',AC)+sec('d','负债',DC)}
const BM={
 net:{n:'净资产',d:'权威锚点只有全国中位数（CHFS 2019）。10万～300万档按“中位数38.84万、财富基尼0.70”建模，并与多方测算交叉核对得出，属综合推算，非官方，误差可能较大。600万、1000万档按胡润总资产口径只能给出上限。',
  T:[[10,HH*.80,'综合推算'],[50,HH*.42,'综合推算'],[100,HH*.21,'综合推算'],[300,HH*.065,'综合推算'],[600,null,null,408.3],[1000,null,null,162.5]]},
 gross:{n:'总资产',d:'含自住房的全部资产，不扣负债，对应胡润“总财富”。内地数据，截至2025年1月1日；低于600万档暂无数据。',
  T:[[10],[50],[100],[300],[600,408.3,'胡润·内地'],[1000,162.5,'胡润·内地']]},
 inv:{n:'可投资资产',d:'不含自住房，含投资性房产、现金、基金、股票等。胡润数据含港澳台，占比略偏高，内地数据暂无；低于600万档暂无数据。',
  T:[[10],[50],[100],[300],[600,182.7,'胡润·含港澳台'],[1000,105.7,'胡润·含港澳台']]}};
const hhs=h=>h>=10000?(h/10000).toFixed(2)+'亿户':(Math.round(h*10)/10)+'万户';
function vBench(c){const m=BM[S.basis],bv=basisVal(c),pc=x=>x.toFixed(x<1?2:1)+'%';
 const rows=m.T.map(([t,h,src,ub])=>{const ok=h&&bv>=t,x=h?h/HH*100:0;
  return`<div class="${ok?'hit':''}" style="padding:6px 8px"><div class="row" style="border:0;padding:0"><b>${w(t)}以上</b>${h?`<span>约 ${pc(x)} · ${hhs(h)}</span>`:ub?`<span class="s">不超过约 ${pc(ub/HH*100)}</span>`:'<span class="s">暂无数据</span>'}</div>${!h&&ub?'<div class="s">胡润总资产口径的上限，净资产只会更少</div>':''}${h?`<div class="bar"><i style="width:${Math.max(2,x)}%"></i></div><div class="s">${src}</div>`:''}</div>`}).join('');
 const got=m.T.filter(z=>z[1]&&bv>=z[0]).pop(),nx=m.T.find(z=>z[1]&&bv<z[0]);
 const pos=bv<0?'为负，低于所有档位':(S.basis=='net'&&bv<300)?`约超过全国 ${pct(bv).toFixed(0)}% 的家庭（综合推算，非官方）`:got?`已达到 ${w(got[0])} 档，全国约前 ${pc(got[1]/HH*100)}（${got[2]}）`:nx?`低于最低有数据档位 ${w(nx[0])}，具体位置暂无数据`:'暂无数据';
 return`<div class="c"><div class="g">${[['net','净资产'],['gross','总资产'],['inv','可投资']].map(([k,n])=>`<button class="${S.basis==k?'':'l'}" data-a="b" data-p="${k}">${n}</button>`).join('')}</div>
 <div style="margin-top:10px">你的${m.n}：<b>${w(bv)}</b></div><div>${pos}</div>
 ${nx&&got?`<div class="s">距离 ${w(nx[0])} 还差 ${w(nx[0]-bv)}</div>`:''}</div>
 <div class="c"><h2>国内家庭对标（按约 5 亿户）· ${m.n}</h2>${rows}<div class="s">${m.d}</div></div>
 ${S.basis=='net'?'<div class="c"><h2>权威参考点</h2><div class="row"><span>全国家庭财富中位数<div class="s">CHFS·西南财大，2019年</div></span><b>38.84万</b></div><div class="row"><span>城镇家庭净资产中位数<div class="s">央行调查，2019年，仅城镇</div></span><b>141万</b></div></div>':''}
 <div class="c"><h2>国际参考：美元百万富翁人数（成年个人）</h2>
 <div class="row"><span>中国大陆</span><b>约 630 万</b></div><div class="row"><span>法国</span><b>约 280 万</b></div>
 <div class="s">来源：瑞银《全球财富报告2025》（2024年底数据）。口径是个人而非家庭，1百万美元约合人民币700万元上下，仅作量级参考。</div></div>`}
// 对标模块：只在「总览」页底部以折叠形式展示，点击展开
function benchFold(c){return `<details class="c"><summary>📍 国内家庭对标（展开查看）</summary><div class="inner">${vBench(c).replace(/<div class="c">/g,'<div class="fold">')}</div></details>`}
function snapList(){return S.snaps.slice(-24).reverse().map(x=>`<div class="row"><span class="s">${x.d}${x.d==curM()?'（本月，进行中）':''}</span><b>${w(x.nw)}</b></div>`).join('')}
function flowSum(){let inc=0,exp=0;S.flow.forEach(x=>x.t=='i'?inc+=x.v:exp+=x.v);return{inc,exp,bal:inc-exp,n:S.flow.length}}
const yuan=v=>Math.round(v).toLocaleString('zh-CN')+'元';
function brk(t){const L=S.flow.filter(x=>x.t==t),tot=L.reduce((a,x)=>a+x.v,0),m={};L.forEach(x=>m[x.c]=(m[x.c]||0)+x.v);
 return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="border:0;padding:4px 0"><span>${k}</span><span>${yuan(v)} · ${(v/tot*100).toFixed(0)}%</span></div><div class="bar"><i style="width:${v/tot*100}%"></i></div>`).join('')}
function vFlow(){const f=flowSum();
 const sec=(t,n,cats)=>{const L=S.flow.map((x,i)=>[x,i]).filter(([x])=>x.t==t);
  return`<div class="c"><h2>${n}（每月，元）</h2>${L.map(([x,i])=>`<div class="row"><div>${esc(x.n)}<div class="s">${x.c}</div></div><div>${yuan(x.v)}<button class="x" data-a="delf" data-p="${i}">删</button></div></div>`).join('')||'<div class="s">暂无</div>'}
  <div class="f" style="margin-top:10px"><div class="f2"><select id="fc${t}">${cats.map(x=>`<option>${x}</option>`).join('')}</select><input id="fn${t}" placeholder="名称"></div>
  <div class="f2"><input id="fv${t}" type="number" inputmode="decimal" placeholder="每月金额（元）"><button data-a="addf" data-p="${t}">添加</button></div></div></div>`};
 return`<div class="c"><div class="g"><div><span class="s">月收入</span><b class="pos">${yuan(f.inc)}</b></div><div><span class="s">月支出</span><b class="neg">${yuan(f.exp)}</b></div><div><span class="s">月结余</span><b class="${f.bal<0?'neg':''}">${yuan(f.bal)}</b></div></div>
 <div class="s" style="margin-top:8px">${f.inc?'储蓄率 '+(f.bal/f.inc*100).toFixed(1)+'%；年结余约 '+w(f.bal*12/10000):'录入收入和支出后显示储蓄率'}。年度收入（如年终奖）请除以12后填入。</div></div>
 ${f.inc?'<div class="c"><h2>收入来源占比</h2>'+brk('i')+'</div>':''}${f.exp?'<div class="c"><h2>支出构成</h2>'+brk('e')+'</div>':''}
 `+sec('i','收入来源',['工资','奖金/年终','经营','租金','投资收益','其他'])+sec('e','每月支出',['房贷/房租','餐饮','交通','日用','教育','医疗','保险','娱乐','其他'])}

const PAL=['#2563eb','#16a34a','#f59e0b','#dc2626','#8b5cf6','#0891b2','#db2777','#65a30d'];
const FIXA=['自住房','车辆','公积金/养老'],FIXD=['房贷','车贷'];
function catSum(){const m={};S.items.filter(x=>x.t=='a').forEach(x=>m[x.c]=(m[x.c]||0)+x.v);return m}
function pie(m){const e=Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),t=e.reduce((a,x)=>a+x[1],0);if(!t)return'<div class="s">暂无资产</div>';
 let off=25;const arcs=e.map(([k,v],i)=>{const q=v/t*100,r=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${PAL[i%8]}" stroke-width="7" stroke-dasharray="${q} ${100-q}" stroke-dashoffset="${off}"/>`;off-=q;return r}).join('');
 return`<svg viewBox="0 0 42 42" width="170" style="display:block;margin:0 auto 8px"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="7"/>${arcs}</svg>`+e.map(([k,v],i)=>`<div class="row" style="border:0;padding:3px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PAL[i%8]};margin-right:6px"></i>${k}</span><span>${w(v)} · ${(v/t*100).toFixed(1)}%</span></div>`).join('')}
function splitCard(){let fa=0,fd=0,ia=0,id=0;S.items.forEach(x=>{if(x.t=='a')FIXA.includes(x.c)?fa+=x.v:ia+=x.v;else FIXD.includes(x.c)?fd+=x.v:id+=x.v});
 const k=(n,v,a,d)=>`<div><span class="s">${n}</span><b class="${v<0?'neg':''}">${w(v)}</b><span class="s">资产${w(a)}−负债${w(d)}</span></div>`;
 return`<div class="c"><h2>固定 / 投资净资产</h2><div class="f2" style="text-align:center">${k('固定净资产',fa-fd,fa,fd)}${k('投资净资产',ia-id,ia,id)}</div><div class="s" style="margin-top:8px">固定=自住房、车辆、公积金/养老，扣房贷车贷；投资=现金、理财、股票、投资房产等，扣其他负债。</div></div>`}
function remind(){const n=new Date(),d=n.getDate(),last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),u=S.upd?new Date(S.upd):new Date(0);
 const st=d>=last-2?new Date(n.getFullYear(),n.getMonth(),last-2):d<=3?new Date(n.getFullYear(),n.getMonth(),1):null;
 if(!st||u>=st)return'';return`<div class="c" style="background:var(--ac);color:#fff"><b>📅 ${d<=3?'月初':'月底'}了，请更新各项余额</b><div class="f2" style="margin-top:8px"><button class="l" data-a="goacc">去更新</button><button class="l" data-a="ok">已核对，无需更新</button></div></div>`}
function sd(){S.side=Object.assign({list:['YouTube','抖音 / TikTok','小红书','Twitter (X)','微信公众号 + 离线软件包','开发并售卖 App'].map(n=>({n}))},S.side||{});
 S.side.list.forEach(x=>{x.mo=x.mo||{};if(x.act!=null){if(x.act)x.mo[curM()]=x.act;delete x.act}x.inc=x.inc||0;x.base=x.base||0;x.bio=x.bio||''});return S.side}
function saveSide(){const D=sd();document.querySelectorAll('[data-i]').forEach(e=>{const x=D.list[+e.dataset.i],k=e.dataset.k;if(!x)return;if(k=='bio')x.bio=e.value;else if(k=='act')x.mo[curM()]=parseFloat(e.value)||0;else x[k]=parseFloat(e.value)||0})}
function vSide(c){const D=sd(),f=flowSum(),g=S.goal,L=D.list,b=basisVal(c);
 const cur=x=>x.mo[curM()]||0,tot=x=>x.base+Object.values(x.mo).reduce((p,q)=>p+q,0);
 const I=L.reduce((a,x)=>a+x.inc,0),A=L.reduce((a,x)=>a+cur(x),0),T=L.reduce((a,x)=>a+tot(x),0);
 const m0=months(b,g.target,g.save,4),m1=months(b,g.target,g.save+I/10000,4);
 const inp=(i,k,n,v)=>`<label class="s">${n}<input type="number" step="1" data-i="${i}" data-k="${k}" value="${v}"></label>`;
 const card=(x,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--bd)"><div class="row" style="border:0;padding:0"><b>${esc(x.n)}</b><span style="white-space:nowrap"><button class="x" style="color:var(--ac);padding:6px 12px;font-size:18px" data-a="mvside" data-p="${i}:-1">▲</button><button class="x" style="color:var(--ac);padding:6px 12px;font-size:18px" data-a="mvside" data-p="${i}:1">▼</button><button class="x" data-a="delside" data-p="${i}">删</button></span></div>
 <textarea data-i="${i}" data-k="bio" rows="3" placeholder="简介：准备在这个平台做哪些内容、更新频率、怎么变现……" style="margin:6px 0">${esc(x.bio)}</textarea>
 <div class="f2">${inp(i,'inc','预期稳定月收入(元)',x.inc)}${inp(i,'act','本月实际收入(元)',cur(x))}</div>
 <div class="f2" style="margin-top:6px">${inp(i,'base','此前已累计收入(元)',x.base)}<div><span class="s">当前总收入</span><b style="display:block;font-size:18px;margin-top:6px">${yuan(tot(x))}</b></div></div>
 ${x.inc?`<div class="bar"><i style="width:${Math.min(100,cur(x)/x.inc*100)}%"></i></div><div class="s">本月达成预期的 ${(cur(x)/x.inc*100).toFixed(0)}%</div>`:''}</div>`;
 return`<div class="c"><h2>副业增值项目</h2><div class="g"><div><span class="s">预期稳定月收入</span><b class="pos">${yuan(I)}</b></div><div><span class="s">本月实际收入</span><b>${yuan(A)}</b></div><div><span class="s">当前总收入</span><b>${yuan(T)}</b></div></div>
 <div class="s" style="margin-top:8px">每个项目写一段简介，副业用零散时间做，所以不按小时规划。“当前总收入” = 此前已累计 + 每月实际收入的累加，每个月底更新一次本月实际收入即可。</div></div>
 ${I>0?`<div class="c"><h2>对财务的影响</h2><div class="row"><span>月结余</span><b>${yuan(f.bal)} → ${yuan(f.bal+I)}</b></div>${f.inc?`<div class="row"><span>储蓄率</span><b>${(f.bal/f.inc*100).toFixed(0)}% → ${((f.bal+I)/(f.inc+I)*100).toFixed(0)}%</b></div>`:''}<div class="row"><span>达成目标（4%收益）</span><b>${yrs(m0)} → ${yrs(m1)}</b></div><div class="s">按副业收入已稳定并全部转为储蓄计算，未计税费、平台抽成和前期成本。</div></div>`:''}
 <div class="c">${L.map(card).join('')||'<div class="s">暂无项目</div>'}
 <div class="f2" style="margin-top:10px"><input id="sn" placeholder="新增项目名称"><button class="l" data-a="addside">添加</button></div><button data-a="saveside" style="margin-top:10px">保存</button>
 <div class="s" style="margin-top:8px">填完点“保存”，否则切换页面会丢失。预期收入是你自己的估计，建议保守填写。</div></div>`}
function vEval(c){const f=flowSum(),cash=S.items.filter(x=>x.t=='a'&&x.c=='现金存款').reduce((a,x)=>a+x.v,0)*10000;
 const top=Math.max(0,...Object.values(catSum())),sn=S.snaps,gr=sn.length>1&&sn[sn.length-2].nw>0?(sn[sn.length-1].nw/sn[sn.length-2].nw-1)*100:null;
 const mo=f.exp?cash/f.exp:null,pay=f.inc?S.flow.filter(x=>x.t=='e'&&x.c=='房贷/房租').reduce((a,x)=>a+x.v,0)/f.inc*100:null,sv=f.inc?f.bal/f.inc*100:null,cc=c.a?top/c.a*100:null;
 const L=(v,r,y,hi)=>v==null?null:hi?(v>r?0:v>y?1:2):(v<r?0:v<y?1:2);
 const tg=mo!=null&&mo<3?3:6;
 const R=[['应急金（现金类）',mo==null?null:mo.toFixed(1)+' 个月支出',L(mo,3,6,0),mo!=null&&mo<6?`现金类再存约 ${Math.max(0,Math.round(f.exp*tg-cash)).toLocaleString()} 元，可达 ${tg} 个月`:'充足'],
 ['负债率',c.a?c.rate.toFixed(1)+'%':null,c.a?L(c.rate,70,50,1):null,c.rate>50?'优先降低高息负债，暂缓新增借款':'处于健康区间'],
 ['月供/房租占收入',pay==null?null:pay.toFixed(0)+'%',L(pay,50,35,1),pay>35?'占比偏高，避免新增长期债务':'压力可控'],
 ['储蓄率',sv==null?null:sv.toFixed(0)+'%',L(sv,10,20,0),sv!=null&&sv<20?'增收或压缩可变支出，把结余固定转入投资':'保持'],
 ['资产集中度',cc==null?null:cc.toFixed(0)+'%',L(cc,80,60,1),cc>60?'单一类别过高，逐步增加流动资产比重':'分布较均衡'],
 ['净资产月增速',gr==null?null:gr.toFixed(1)+'%',gr==null?null:L(gr,0,1,0),gr!=null&&gr<1?'增长偏慢或下降，核对收支和资产变动':'增长正常']];
 const ok=R.filter(r=>r[2]!=null),score=ok.length?Math.round(ok.reduce((a,r)=>a+r[2],0)/(ok.length*2)*100):null,red=ok.filter(r=>r[2]==0).length;
 return`<div class="c"><h2>财务健康评估</h2><div class="big">${score==null?'暂无':score+' 分'}</div>${R.map(r=>`<div class="row" style="align-items:flex-start"><div>${r[2]==null?'⚪':['🔴','🟡','🟢'][r[2]]} ${r[0]}<div class="s">${r[3]}</div></div><b>${r[1]||'暂无数据'}</b></div>`).join('')}
 ${red?`<div class="s" style="margin-top:8px">有 ${red} 项红灯：增收是改善的重点，可在下方“副业增值项目”里规划投入。</div>`:''}
 <div class="s">阈值为常见经验线，不构成投资建议；储蓄率含不可自由支配的公积金收入，可能偏高。</div></div>`}
function vPlan(c){return vGoal(c)
+`<details class="c"><summary>🩺 财务健康评估（展开查看）</summary><div class="inner">${vEval(c).replace(/<div class="c">/g,'<div class="fold">')}</div></details>`
+`<details class="c"><summary>🚀 副业增值项目（展开查看）</summary><div class="inner">${vSide(c).replace(/<div class="c">/g,'<div class="fold">')}</div></details>`}
function vGoal(c){const g=S.goal,s=basisVal(c),fl=flowSum();
 return`<div class="c"><h2>目标规划（以${BM[S.basis].n}为起点）</h2><div class="f2">
 <label class="s">目标（万元）<input id="gt" type="number" inputmode="decimal" value="${g.target}"></label>
 <label class="s">每月储蓄（万元）<input id="gs" type="number" inputmode="decimal" step="0.1" value="${g.save}"></label></div><br><button data-a="goal">计算</button>${fl.n?`<button class="l" style="margin-top:8px" data-a="usebal">使用收支月结余 ${(fl.bal/10000).toFixed(2)}万/月</button>`:''}</div>
 <div class="c"><h2>预计达成</h2>${[['悲观',2],['中性',4],['乐观',6]].map(([n,r])=>`<div class="row"><span>${n}（年化${r}%）</span><b>${yrs(months(s,g.target,g.save,r))}</b></div>`).join('')}
 <div class="s">当前 ${w(s)}，目标 ${w(g.target)}。未计通胀、税费和收入变化。</div></div>`}
function act(a,p){const c=calc();
 if(a=='add'){const n=document.getElementById('n'+p).value.trim(),v=parseFloat(document.getElementById('v'+p).value);
  if(!n||isNaN(v)||v<0)return alert('请填写名称和有效金额');S.items.push({t:p,c:document.getElementById('c'+p).value,n,v})}
 else if(a=='del'){if(!confirm('删除这一项？'))return;S.items.splice(+p,1)}
 else if(a=='addf'){const n=document.getElementById('fn'+p).value.trim(),v=parseFloat(document.getElementById('fv'+p).value);
  if(!n||isNaN(v)||v<0)return alert('请填写名称和有效金额');S.flow.push({t:p,c:document.getElementById('fc'+p).value,n,v})}
 else if(a=='delf'){if(!confirm('删除这一项？'))return;S.flow.splice(+p,1)}
 else if(a=='usebal'){S.goal.save=Math.max(0,+(flowSum().bal/10000).toFixed(2))}
 else if(a=='goacc')tab=1;
 else if(a=='ok')S.upd=new Date().toISOString();
 else if(a=='saveside')saveSide();
 else if(a=='mvside'){const[i,d]=p.split(':').map(Number),L=sd().list,j=i+d;saveSide();if(j>=0&&j<L.length)[L[i],L[j]]=[L[j],L[i]]}
 else if(a=='addside'){saveSide();const n=document.getElementById('sn').value.trim();if(!n)return alert('请填写项目名称');sd().list.push({n,inc:0,base:0,mo:{},bio:''})}
 else if(a=='delside'){if(!confirm('删除这个项目？'))return;saveSide();sd().list.splice(+p,1)}
 else if(a=='b')S.basis=p;
 else if(a=='goal'){S.goal={target:parseFloat(document.getElementById('gt').value)||0,save:parseFloat(document.getElementById('gs').value)||0}}
 else if(a=='snap'){const d=new Date().toISOString().slice(0,7);S.snaps=S.snaps.filter(x=>x.d!=d);S.snaps.push({d,nw:c.net});S.snaps.sort((x,y)=>x.d<y.d?-1:1)}
 else if(a=='exp'){const t=JSON.stringify({app:'wealth-compass',name:'财富罗盘',version:2,exportedAt:new Date().toISOString(),data:S}),b=document.getElementById('bk');b.value=t;b.select();const ok=()=>toast('已复制，去备忘录粘贴保存'),no=()=>toast('已填入文本框，长按全选复制');try{const p=navigator.clipboard&&navigator.clipboard.writeText(t);if(p&&p.then)p.then(ok,no);else no()}catch(e){no()}return}
 else if(a=='imp'){try{const o=JSON.parse(document.getElementById('bk').value);let d=null;if(o&&o.data&&Array.isArray(o.data.items))d=o.data;else if(o&&Array.isArray(o.items))d=o;if(!d)throw 0;const n1=d.items.filter(x=>x.t=='a').length,n2=(d.flow||[]).length;if(!confirm(`将用备份覆盖当前数据：资产 ${n1} 项 / 收支 ${n2} 项，继续吗？`))return;S=Object.assign(def(),d)}catch(e){return alert('内容无效：请粘贴完整的备份文本')}}
 if(a=='add'||a=='del')S.upd=new Date().toISOString();
 save();view()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
save();view();
</script></body></html>
